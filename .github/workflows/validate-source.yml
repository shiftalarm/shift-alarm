name: Validate Shift Alarm Source

on:
  push:
    branches:
      - 'fix/v1.2.3-reboot-from-1.2.2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Compile and test source (no release APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate AndroidManifest XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('Manifest XML valid')"
      - name: Compile Kotlin sources only
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace
