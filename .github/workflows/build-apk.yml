name: Build Shift Alarm APK

on:
  push:
    branches:
      - feature/complete-shift-alarm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Shift Alarm release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate AndroidManifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse(Path("app/src/main/AndroidManifest.xml"))
          print("SUCCESS: AndroidManifest XML is valid.")
          PY

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHIFTALARM_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing SHIFTALARM_KEYSTORE_BASE64" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shiftalarm-release.jks"
          test -s "$RUNNER_TEMP/shiftalarm-release.jks"

      - name: Build signed Release APK
        env:
          SHIFTALARM_KEYSTORE_PATH: ${{ runner.temp }}/shiftalarm-release.jks
          SHIFTALARM_KEYSTORE_PASSWORD: ${{ secrets.SHIFTALARM_KEYSTORE_PASSWORD }}
          SHIFTALARM_KEY_ALIAS: ${{ secrets.SHIFTALARM_KEY_ALIAS }}
          SHIFTALARM_KEY_PASSWORD: ${{ secrets.SHIFTALARM_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK with version
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Shift-Alarm-v1.1.0-release.apk

      - name: Upload signed Shift Alarm APK
        uses: actions/upload-artifact@v4
        with:
          name: Shift-Alarm-v1.1.0-release
          path: release/Shift-Alarm-v1.1.0-release.apk
          if-no-files-found: error
          retention-days: 30
