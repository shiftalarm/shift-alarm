
name: Build Shift Alarm APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Shift Alarm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix AndroidManifest XML
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          raw = path.read_bytes()

          # Remove UTF-8 BOM if present
          raw = raw.removeprefix(b'\xef\xbb\xbf')

          # Remove whitespace before XML declaration
          raw = raw.lstrip(b' \t\r\n')

          # Ensure XML declaration starts at byte zero
          path.write_bytes(raw)

          print("Manifest leading whitespace fixed.")
          print("First bytes:", repr(raw[:50]))
          PY

      - name: Validate AndroidManifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          raw = path.read_bytes()

          ET.fromstring(raw)

          print("SUCCESS: AndroidManifest XML is valid.")
          print("First bytes:", repr(raw[:50]))
          PY

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK with version
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Shift-Alarm-v1.1.0.apk

      - name: Upload Shift Alarm APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shift-Alarm-v1.1.0
          path: app/build/outputs/apk/debug/Shift-Alarm-v1.1.0.apk
          if-no-files-found: error
